
name: Encrypted Variable Demo

on: workflow_dispatch

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Use Secret
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo "Secret loaded successfully"
          else
            echo "Secret not found"
            exit 1
          fi
